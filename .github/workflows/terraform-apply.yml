name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Mask known infrastructure values
        shell: bash
        run: |
          echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
          echo "::add-mask::${{ vars.TF_STATE_BUCKET }}"
          echo "::add-mask::${{ vars.TF_LOCK_TABLE }}"
          echo "::add-mask::${{ vars.PROD_DOMAIN_NAME }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.x'

      - name: Terraform init
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "platform-resume/prod/terraform.tfstate"
          region         = "${{ vars.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF
          terraform init -input=false -backend-config=backend.hcl
          rm -f backend.hcl

      - name: Terraform apply
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          set +x

          terraform apply \
            -input=false \
            -auto-approve \
            -no-color \
            -var="domain_name=${{ vars.PROD_DOMAIN_NAME }}" \
            > apply.log 2>&1

          status=$?

          if [ "$status" -eq 0 ]; then
            grep -E "Apply complete|No changes" apply.log || true
            rm -f apply.log
            echo "✅ Terraform apply completed successfully."
            exit 0
          else
            echo "❌ Terraform apply failed. Full output intentionally suppressed in public logs."
            rm -f apply.log
            exit "$status"
          fi
